<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站收藏</title>
<meta name="description" content="maxuexin 的网站收藏：常用网站导航，点击卡片直达，支持名称与网址搜索。">
<meta name="theme-color" content="#08080b">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/shortcuts.css">

<body>

<main id="app">
    <h1 class="page-title" id="page-title">网站收藏</h1>
    <p class="page-note" id="page-note"></p>

    <div class="tool-bar">
        <label class="sr-only" for="search">搜索网站</label>
        <input id="search" type="search" placeholder="搜索网站名称 / 网址" autocomplete="off">
    </div>

    <div id="boards"></div>

    <p class="footer-tip" id="footer-tip"></p>
</main>

<script src="../js/wangzhan-data.js"></script>
<script src="../js/wangzhan.js"></script>
<script src="../js/drive-btn.js"></script>

</html>
